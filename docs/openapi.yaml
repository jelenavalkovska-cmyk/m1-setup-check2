# Ezermalas pieteikumu sistēma · iesniegumu API · līgums v0
# Līgumu maina analītiķis. Katra izmaiņa: atsevišķs komits ar pieteikuma ID.

openapi: 3.0.3
info:
  title: Ezermalas pieteikumu sistēma · iesniegumu API
  version: 0.2.0
  description: |
    Iedzīvotāju iesniegumu pieņemšana un apskate.

    Šis līgums ir analītiķa artefakts un patiesības avots (source of truth).
    Ja programma atbild citādi, nekā rakstīts šeit, tā ir kļūda programmā
    vai līgumā, un par to jālemj.

    > Noteikumi vienkāršoti mācību vajadzībām. Ezermalas novada pašvaldība
    > un OMD reģistrs ir izdomāti. Visi dati ir sintētiski.
servers:
  - url: http://localhost:8000
    description: Lokālais prototips (Codespace)
tags:
  - name: Iesniegumi
    description: Iesnieguma pieņemšana un apskate (R1–R3)
  - name: Sistēma
    description: Tehniskie galapunkti (R4)
  - name: Autentifikācija
    description: Reģistrācija un pieteikšanās (CR-4)

security:
  - sessionCookie: []

paths:
  /health:
    get:
      tags: [Sistēma]
      operationId: getHealth
      summary: Vai serviss darbojas
      security: []
      responses:
        '200':
          description: Serviss darbojas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /submissions:
    post:
      tags: [Iesniegumi]
      operationId: createSubmission
      summary: Iesniegt iesniegumu
      description: |
        Pieņem iesniegumu, piešķir ID, statusu `RECEIVED`, saņemšanas laiku
        un atbildes termiņu.

        **Atbildes kanāls (CR-2).** Pēc saņemšanas sistēma pārbauda
        iesniedzēja oficiālo e-adresi OMD reģistrā un nosaka `replyChannel`:
        - OMD `ACTIVE` → `E_ADDRESS`, neatkarīgi no `preferredChannel`.
        - OMD `NOT_ACTIVATED` → `preferredChannel`. Ja izvēlēts `E_ADDRESS`,
          bet e-adrese nav aktivizēta: `EMAIL`, un `reasonCode` norāda iemeslu.
        - OMD 404 (reģistrā nav ieraksta) → tāpat kā `NOT_ACTIVATED`.
          404 nenozīmē, ka personas nav, tikai to, ka reģistrā nav ieraksta.
        - OMD 5xx, noildze (atbilde nav saņemta 3 s laikā), bojāta atbilde
          vai nedokumentēts statuss → `replyChannel` = `PENDING_CHANNEL_CHECK`,
          `reasonCode` = `REGISTER_UNAVAILABLE`. Sistēma kanālu neuzmin.
          Iesniegums tik un tā tiek pieņemts ar `201`; darbinieks kanālu
          pārbauda vēlāk (automātiska atkārtošana ir ārpus apjoma).

        OMD kļūme **nekad** neizraisa šīs operācijas `5xx` atbildi.
        `5xx` nozīmē tikai pašas sistēmas kļūmi, un tad iesniegums netiek
        saglabāts.

        Katrs ne-veiksmīgs OMD pārbaudes iznākums tiek žurnalēts ar līmeni
        WARNING, norādot iesnieguma ID un iemeslu. Personas kods un
        iesnieguma teksts (`body`) žurnālā netiek ierakstīti. OMD piekļuves
        marķieri sistēma nolasa no vides mainīgā `OMD_API_TOKEN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
            example:
              personalCode: '32000000001'
              fullName: Līga Ozoliņa-Kalniņa
              email: liga@example.com
              preferredChannel: EMAIL
              topic: ROADS
              subject: Bedre Ezera ielā
              body: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.
      responses:
        '201':
          description: Iesniegums pieņemts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
              examples:
                eAddressActive:
                  summary: OMD ACTIVE
                  value:
                    id: IES-2026-000123
                    status: RECEIVED
                    receivedAt: '2026-10-01T09:15:00Z'
                    dueDate: '2026-11-02'
                    replyChannel: E_ADDRESS
                    reasonCode: null
                eAddressNotActive:
                  summary: Izvēlēta E_ADDRESS, bet OMD NOT_ACTIVATED vai 404
                  value:
                    id: IES-2026-000124
                    status: RECEIVED
                    receivedAt: '2026-10-01T09:20:00Z'
                    dueDate: '2026-11-02'
                    replyChannel: EMAIL
                    reasonCode: E_ADDRESS_NOT_ACTIVE
                registerUnavailable:
                  summary: OMD 5xx, noildze vai bojāta atbilde
                  value:
                    id: IES-2026-000125
                    status: RECEIVED
                    receivedAt: '2026-10-01T09:25:00Z'
                    dueDate: '2026-11-02'
                    replyChannel: PENDING_CHANNEL_CHECK
                    reasonCode: REGISTER_UNAVAILABLE
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /submissions/{id}:
    get:
      tags: [Iesniegumi]
      operationId: getSubmission
      summary: Iesniegums pēc ID
      description: Darbinieks atver vienu iesniegumu pēc tā ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Iesnieguma ID
          schema:
            type: string
            example: IES-2026-000123
      responses:
        '200':
          description: Iesniegums atrasts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/register:
    post:
      tags: [Autentifikācija]
      operationId: registerUser
      summary: Reģistrēt lietotāju
      description: |
        Izveido lietotāja kontu (CR-4). Parole tiek glabāta tikai kā bcrypt
        jaucējvērtība, nekad atklātā tekstā. E-pasts tiek glabāts mazajiem
        burtiem un ir unikāls neatkarīgi no burtu reģistra.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: lietotajs@example.com
              password: drosa-parole-1
              passwordConfirm: drosa-parole-1
      responses:
        '201':
          description: Konts izveidots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/RegisterValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Autentifikācija]
      operationId: loginUser
      summary: Pieteikties
      description: |
        Pārbauda e-pastu un paroli. Veiksmes gadījumā izveido sesiju uz 8
        stundām un iestata `HttpOnly`, `SameSite=Lax` sīkdatni `session`.
        Datu bāzē tiek glabāta tikai sesijas marķiera SHA-256 jaucējvērtība.
        Nepareizs e-pasts un nepareiza parole dod vienādu atbildi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: lietotajs@example.com
              password: drosa-parole-1
      responses:
        '200':
          description: Pieteikšanās izdevās
          headers:
            Set-Cookie:
              description: Sesijas sīkdatne `session`
              schema:
                type: string
                example: session=abc123; HttpOnly; Max-Age=28800; Path=/; SameSite=lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Autentifikācija]
      operationId: logoutUser
      summary: Iziet
      description: Beidz pašreizējo sesiju un dzēš sīkdatni `session`.
      responses:
        '204':
          description: Sesija beigta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Autentifikācija]
      operationId: getCurrentUser
      summary: Pieteiktais lietotājs
      responses:
        '200':
          description: Pieteiktā lietotāja dati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        Sesijas sīkdatne, ko iestata `POST /auth/login` (CR-4).
        Visi galapunkti, kuriem nav norādīts `security: []`, pieejami tikai
        pieteiktiem lietotājiem; bez derīgas sesijas atbilde ir `401`.

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.2.0

    SubmissionCreate:
      type: object
      required:
        - personalCode
        - fullName
        - email
        - preferredChannel
        - topic
        - subject
        - body
      properties:
        personalCode:
          type: string
          description: Iesniedzēja personas kods
          example: '32000000001'
        fullName:
          type: string
          description: Iesniedzēja vārds un uzvārds
          example: Jānis Bērziņš
        email:
          type: string
          format: email
          description: Iesniedzēja e-pasts
          example: janis@example.com
        preferredChannel:
          $ref: '#/components/schemas/PreferredChannel'
        topic:
          $ref: '#/components/schemas/Topic'
        subject:
          type: string
          description: Iesnieguma temats
          example: Bedre Ezera ielā
        body:
          type: string
          description: Iesnieguma teksts
          example: Pie Ezera ielas 12 ir liela bedre. Lūdzu, salabojiet to.

    SubmissionCreated:
      type: object
      required: [id, status, receivedAt, dueDate, replyChannel]
      properties:
        id:
          type: string
          description: Iesnieguma ID
          example: IES-2026-000123
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
          description: Saņemšanas laiks
          example: '2026-10-01T09:15:00Z'
        dueDate:
          type: string
          description: Atbildes termiņš
          example: '2026-11-02'
        replyChannel:
          $ref: '#/components/schemas/ReplyChannel'
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'

    Submission:
      description: Pilns iesnieguma ieraksts
      allOf:
        - $ref: '#/components/schemas/SubmissionCreated'
        - $ref: '#/components/schemas/SubmissionCreate'

    PreferredChannel:
      type: string
      description: Kā iesniedzējs vēlas saņemt atbildi
      enum: [EMAIL, POST, E_ADDRESS]
      example: EMAIL

    ReplyChannel:
      type: string
      description: |
        Kanāls, pa kuru sūtīs atbildi (nosaka sistēma, CR-2):
        `EMAIL` e-pasts · `POST` pasts · `E_ADDRESS` oficiālā e-adrese ·
        `PENDING_CHANNEL_CHECK` OMD reģistrs nebija pieejams, kanālu
        darbinieks pārbaudīs vēlāk.
      enum: [EMAIL, POST, E_ADDRESS, PENDING_CHANNEL_CHECK]
      example: E_ADDRESS

    ReasonCode:
      type: string
      nullable: true
      description: |
        Kāpēc `replyChannel` noteikts citādi (CR-2):
        - `E_ADDRESS_NOT_ACTIVE` iesniedzējs izvēlējās `E_ADDRESS`, bet OMD
          atbildēja `NOT_ACTIVATED` vai 404. Atbilde tiek sūtīta uz `EMAIL`.
        - `REGISTER_UNAVAILABLE` OMD atbildēja ar 5xx, neatbildēja 3 s laikā,
          atbilde bija bojāta vai ar nedokumentētu statusu.
          `replyChannel` = `PENDING_CHANNEL_CHECK`.

        `null`, ja neviens no šiem gadījumiem nav iestājies.
      enum: [E_ADDRESS_NOT_ACTIVE, REGISTER_UNAVAILABLE, null]
      example: E_ADDRESS_NOT_ACTIVE

    Topic:
      type: string
      description: |
        Iesnieguma tēma:
        `ROADS` Ceļi un ielas · `WASTE` Atkritumi ·
        `PLANNING` Teritorijas plānošana · `OTHER` Cits
      enum: [ROADS, WASTE, PLANNING, OTHER]
      example: ROADS

    SubmissionStatus:
      type: string
      description: Iesnieguma statuss. Jauns iesniegums vienmēr ir `RECEIVED`.
      enum: [RECEIVED, IN_PROGRESS, FORWARDED, ANSWERED, WITHDRAWN]
      example: RECEIVED

    RegisterRequest:
      type: object
      required: [email, password, passwordConfirm]
      properties:
        email:
          type: string
          format: email
          example: lietotajs@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Vismaz 8 rakstzīmes, ne vairāk kā 72 baiti (bcrypt ierobežojums)
        passwordConfirm:
          type: string
          format: password
          description: Jāsakrīt ar `password`

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: lietotajs@example.com
        password:
          type: string
          format: password

    User:
      type: object
      description: Lietotāja konts. Parole vai tās jaucējvērtība netiek atgriezta.
      required: [id, email, createdAt]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: lietotajs@example.com
        createdAt:
          type: string
          format: date-time
          example: '2026-10-14T09:00:00+00:00'

    Error:
      type: object
      description: Vienota kļūdu shēma visiem galapunktiem
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Kļūdas kods, piemēram, `VALIDATION_ERROR` vai `NOT_FOUND`
              example: VALIDATION_ERROR
            message:
              type: string
              description: Cilvēkam lasāms apraksts. Bez personas datiem.
              example: Request validation failed
            details:
              type: array
              description: Katra lauka kļūda atsevišķi (tikai `VALIDATION_ERROR`)
              items:
                type: object
                required: [field, issue]
                properties:
                  field:
                    type: string
                    example: personalCode
                  issue:
                    type: string
                    example: INVALID_FORMAT

  responses:
    BadRequest:
      description: Kļūdains pieprasījums
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              message: Bad request
    ValidationError:
      description: Kļūdains pieprasījums. Iesniegums netiek saglabāts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: personalCode
                  issue: INVALID_FORMAT
    RegisterValidationError:
      description: |
        Reģistrācijas dati neatbilst noteikumiem. Iespējamās `details` vērtības:
        `email`/`INVALID_FORMAT`, `password`/`TOO_SHORT`, `password`/`TOO_LONG`,
        `passwordConfirm`/`DOES_NOT_MATCH`, `<lauks>`/`REQUIRED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: passwordConfirm
                  issue: DOES_NOT_MATCH
    EmailTaken:
      description: Šis e-pasts jau ir reģistrēts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: EMAIL_TAKEN
              message: Email is already registered
    InvalidCredentials:
      description: Nepareizs e-pasts vai parole
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_CREDENTIALS
              message: Invalid email or password
    Unauthorized:
      description: Nepieciešama pieteikšanās (nav derīgas sesijas)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
    NotFound:
      description: Iesniegums ar šādu ID nav atrasts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Submission not found
    InternalError:
      description: |
        Iekšēja sistēmas kļūda. Nekad netiek atgriezta OMD reģistra
        nepieejamības dēļ (skatīt CR-2).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
    ServiceUnavailable:
      description: Serviss īslaicīgi nav pieejams. Pieprasījumu var atkārtot vēlāk.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Service temporarily unavailable
